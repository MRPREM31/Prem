<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brand Gradient: Neon Indigo to Purple to Pink -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Neon Drop Shadow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Premium Glowing Outer Ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#brand-grad)" stroke-width="36" filter="url(#glow)" />
  
  <!-- High-Contrast Geometric Monogram 'MR.' -->
  <g stroke="url(#brand-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- 'M' Vector Path -->
    <path d="M 106,360 V 160 L 171,270 L 236,160 V 360" />
    
    <!-- 'R' Vector Path -->
    <path d="M 276,360 V 160 H 326 A 50,50 0 0,1 326,260 H 276 M 321,260 L 366,360" />
  </g>

  <!-- Glowing Accent Dot (represented as a pure white circle to stand out perfectly on dark/light tabs) -->
  <circle cx="406" cy="350" r="16" fill="#ffffff" filter="url(#glow)" />
</svg>
