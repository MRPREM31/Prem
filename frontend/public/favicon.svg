<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brand Gradient: Neon Indigo to Purple to Pink -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Beautiful Futuristic Outer Ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#brand-grad)" stroke-width="36" />
  
  <!-- Thick, Ultra-Crisp Futuristic Monogram 'P' -->
  <g fill="url(#brand-grad)">
    <!-- Main stem of P -->
    <path d="M160,120 h40 a28,28 0 0 1 28,28 v216 a28,28 0 0 1 -28,28 h-40 a28,28 0 0 1 -28,-28 v-216 a28,28 0 0 1 28,-28 z" />
    <!-- Loop of P -->
    <path d="M228,120 h100 a104,104 0 0 1 104,104 v4 a104,104 0 0 1 -104,104 h-100 a12,12 0 0 1 -12,-12 v-188 a12,12 0 0 1 12,-12 z M328,272 a48,48 0 0 0 48,-48 v-4 a48,48 0 0 0 -48,-48 h-88 v100 Z" />
    <!-- Glowing Accent Dot (symbolizing AI, intelligence, and modern web) -->
    <circle cx="328" cy="224" r="24" fill="#ffffff" />
  </g>
</svg>
